<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnlyOffice Trial — {{ doc.title|default:"Untitled" }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        body { display: flex; flex-direction: column; }
        .trial-banner {
            background: #1e293b;
            color: #f8fafc;
            padding: 10px 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 0 0 auto;
        }
        .trial-banner strong { color: #fbbf24; }
        #editor-container { width: 100%; flex: 1 1 auto; min-height: 0; }
    </style>
</head>
<body>

<div class="trial-banner">
    <span><strong>OnlyOffice Trial</strong> — editing "{{ doc.title|default:"Untitled" }}" (id {{ doc.id }}). Saves here go to a scratch folder, not the real document.</span>
</div>

<div id="editor-container"></div>

<script src="{{ onlyoffice_server_url }}/web-apps/apps/api/documents/api.js"></script>
<script>
    const config = {{ editor_config_json|safe }};
    config.width = "100%";
    config.height = "100%";
    config.type = "desktop";

    new DocsAPI.DocEditor("editor-container", config);
</script>

</body>
</html>
