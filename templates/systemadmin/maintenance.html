{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LePMITS | System Maintenance</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center shadow-lg shadow-slate-900/10" style="background:#7C0D0E;">
            <i data-lucide="wrench" style="width:26px;height:26px;color:white;"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">System Under Maintenance</h1>
            <p class="text-slate-500 font-medium leading-relaxed">
                LePMITS is temporarily unavailable while the Secretariat System Administrator performs
                scheduled maintenance. Please check back shortly.
            </p>
        </div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
            System Administrators may still sign in to manage this window.
        </p>
        <a href="{% url 'login' %}" class="inline-block px-6 py-3 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-slate-800 transition-all">
            Admin Sign In
        </a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
